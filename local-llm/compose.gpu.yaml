# NVIDIA GPU override. Requires the NVIDIA driver plus the NVIDIA Container Toolkit
# (Linux) or Docker Desktop with WSL2 GPU support (Windows).
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
